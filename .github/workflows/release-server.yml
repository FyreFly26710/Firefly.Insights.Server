name: Release Firefly Insights

on:
  push:
    branches: 
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      build_app: ${{ steps.check.outputs.build_app }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" =~ App[[:space:]]+Version[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION=$(echo "$COMMIT_MSG" | grep -oP 'Version \K[0-9]+\.[0-9]+\.[0-9]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "build_app=true" >> $GITHUB_OUTPUT
          else
            echo "build_app=false" >> $GITHUB_OUTPUT
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

  build-and-push-server:
    needs: check-commit
    if: needs.check-commit.outputs.build_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: firefly26710
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            firefly26710/firefly-insights-server:latest
            firefly26710/firefly-insights-server:${{ needs.check-commit.outputs.version }}

  deploy:
    needs: [check-commit, build-and-push-server]
    if: needs.check-commit.outputs.build_app == 'true'
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CLIENT_ORIGINS: ${{ secrets.CLIENT_ORIGINS }}
    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Configure SSH
        run: |
          echo "Host cf-mac-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USERNAME }}
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config

      - name: Remote Deploy
        run: |
          ssh -o StrictHostKeyChecking=no cf-mac-server << EOF
            mkdir -p /Users/liqiangwang/Repo/Deploy/FireflyInsights
            cd /Users/liqiangwang/Repo/Deploy/FireflyInsights
            
            # Download the latest compose file
            curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -L -o docker-compose.prod.yml \
                 "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.prod.yml"
            
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "CLIENT_ORIGINS=${{ secrets.CLIENT_ORIGINS }}" >> .env
            echo "JWT_KEY=${{ secrets.JWT_KEY }}" >> .env

            export PATH=/usr/local/bin:/opt/homebrew/bin:\$PATH
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          EOF