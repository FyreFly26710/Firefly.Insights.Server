# docker compose -f docker-compose.prod.yml up -d

services:
  # --- Infrastructure ---
  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - firefly-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - PGWEB_SERVER_PORT=8081
      - PGWEB_SERVER_HOST=0.0.0.0
    command: ["--bind=0.0.0.0", "--listen=8081"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - firefly-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - firefly-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  firefly-server:
    image: firefly26710/firefly-insights-server:latest
    restart: always
    ports:
      - "21000:21000" # Gateway Port
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:21000;http://+:32000;http://+:33000;http://+:34000      
      - RabbitMq__Host=rabbitmq
      # Database Connection Strings (All point to the postgres container)
      - ConnectionStrings__UserDb=Host=postgres;Port=5432;Database=insightdb;Username=postgres;Password=postgres;
      - ConnectionStrings__ContentDb=Host=postgres;Port=5432;Database=insightdb;Username=postgres;Password=postgres;
      - ConnectionStrings__AiDb=Host=postgres;Port=5432;Database=insightdb;Username=postgres;Password=postgres;
      
      - Clusters__identityCluster__Address=http://localhost:32000
      - Clusters__contentsCluster__Address=http://localhost:33000
      - Clusters__aiCluster__Address=http://localhost:34000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - firefly-net

networks:
  firefly-net:
    driver: bridge

volumes:
  postgres-data: